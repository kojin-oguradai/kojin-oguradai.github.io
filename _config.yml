# ==========================================================================
# 興人小倉台自治会 ホームページ 設定ファイル
# ※ このファイルを変更した場合、反映まで数分かかることがあります。
# ==========================================================================

title: 興人小倉台自治会
description: 大阪府枚方市小倉東町 興人小倉台自治会の公式ホームページです。自治会からのお知らせ、回覧板、集会所の利用予約状況、自治会規則などを掲載しています。
lang: ja
timezone: Asia/Tokyo

# サイトの公開先URL（GitHub Pages 公開後に設定）
# 例: https://kojin-oguradai.github.io/ の場合は url に記入し、baseurl は空のまま
url: ""
baseurl: ""

# 作成中のお知らせを全ページ上部に表示する（true: 表示 / false: 非表示）
# true の間は検索エンジンにも登録されません。正式公開時に false にしてください。
under_construction: true

# 集会所予約カレンダー（Google カレンダー）
community_calendar:
  # カレンダーID（Google カレンダーの「設定と共有」→「カレンダーの統合」に表示）
  id: 47dd54669523405a305e9db0d4cb95e17b45dfe6c404334c2c80a99b8e7997f7@group.calendar.google.com
  # Google Calendar API のAPIキー
  # 空のままだと Google カレンダーの予定リスト表示、設定するとサイトのデザインで一覧表示する
  # ※ Google Cloud（kojin.oguradai@gmail.com）で作成。このサイトからの Calendar API 読み取り専用に制限済み
  api_key: AIzaSyA5Vfw3Jb8Yc1EeI2wVjjtWwN9bNMmfWBs
  # 一覧に表示する期間（今日から何日先まで）
  days: 60
  # 予定のタイトルを表示するか（false にすると「予約あり」とだけ表示）
  show_title: true

# お知らせ記事のURLの形（例: /news/2026/05/20/soukai/）
permalink: /news/:year/:month/:day/:title/

markdown: kramdown

# サイトに含めないファイル
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
