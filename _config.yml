title: 興人小倉台自治会
description: 大阪府枚方市小倉東町 興人小倉台自治会の公式ホームページです。自治会からのお知らせ、回覧板、集会所の利用予約状況、自治会規則などを掲載しています。
lang: ja
timezone: Asia/Tokyo

# サイトの公開先URL（GitHub Pages 公開後に設定）
# 例: https://kojin-oguradai.github.io/ の場合は url に記入し、baseurl は空のまま
url: ""
baseurl: ""

# 作成中のお知らせを全ページ上部に表示する（true: 表示 / false: 非表示）
# true の間は検索エンジンにも登録されません。正式公開時に false にしてください。
under_construction: true

# お知らせ記事のURLの形（例: /news/2026/05/20/soukai/）
permalink: /news/:year/:month/:day/:title/

markdown: kramdown

# サイトに含めないファイル
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
