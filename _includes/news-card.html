{%- assign t = site.data.news_types[include.post.type] | default: site.data.news_types["お知らせ"] -%}
<article class="news-card {{ t.filter }}">
    <div class="news-meta">
        <span class="news-date">{{ include.post.date | date: "%Y年%-m月%-d日" }}</span>
        <span class="news-tag {{ t.class }}">{{ t.label }}</span>
    </div>
    <h3 class="news-title">{{ include.post.title }}</h3>
    <p class="news-summary">{{ include.post.excerpt | strip_html | strip_newlines | truncate: 100 }}</p>
    <a href="{{ include.post.url | relative_url }}" class="btn-card-link">詳しく読む <i data-lucide="arrow-right-circle"></i></a>
</article>
